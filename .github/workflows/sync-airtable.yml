name: Sync restaurants.json from Airtable

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC
  workflow_dispatch: {}    # allows manual runs from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync data from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW_ID: ${{ secrets.AIRTABLE_VIEW_ID }}
        run: python sync_airtable.py

      - name: Commit and push if changed
        run: |
          git config user.name "airtable-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add restaurants.json
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "chore: sync restaurants.json from Airtable [skip ci]"
            git push
          fi

      - name: Notify pending submissions (persistent issue -> email)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label needs-url --state open --json number --jq '.[0].number' || true)

          if [ -s needs_review.md ]; then
            if [ -n "$EXISTING" ]; then
              echo "Updating issue #$EXISTING"
              gh issue edit "$EXISTING" --body-file needs_review.md
            else
              echo "Creating new pending-review issue"
              gh issue create \
                --title "New submissions waiting for a Maps URL" \
                --body-file needs_review.md \
                --label needs-url
            fi
          else
            if [ -n "$EXISTING" ]; then
              echo "Everything resolved, closing issue #$EXISTING"
              gh issue close "$EXISTING" --comment "No pending submissions right now. ✅"
            else
              echo "Nothing pending."
            fi
          fi
