name: Sync restaurants.json from Airtable

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync data from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW_ID: ${{ secrets.AIRTABLE_VIEW_ID }}
        run: python sync_airtable.py

      - name: Commit and push if changed
        run: |
          git config user.name "airtable-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add restaurants.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "chore: sync restaurants.json from Airtable [skip ci]"
            git push
          fi
